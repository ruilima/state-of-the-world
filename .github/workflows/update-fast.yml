name: Atualizar fontes rápidas

# GDELT, USGS, EONET, HN/arXiv, curated files and the index, every 30 minutes.
# GitHub may start scheduled runs a few minutes late under load.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Deploy runs only when the Cloudflare secrets exist.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Fetch sources
        id: fetch
        # Exits 1 only when an upstream changed format; we still commit and
        # deploy the stale-marked files, then fail the job at the end.
        continue-on-error: true
        run: npm run fetch:fast

      - name: Check published files
        run: npm test

      - name: Commit data
        run: |
          git config user.name "estado-do-mundo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "dados: atualização rápida $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy public --project-name=estado-do-mundo --branch=main --commit-dirty=true

      - name: Fail if an upstream changed format
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Uma fonte mudou de formato. Ver o passo 'Fetch sources'."
          exit 1
